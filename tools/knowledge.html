<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>지식 퀴즈 | 별빛연구소</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <link rel="stylesheet" href="../css/quiz-visual.css" />
</head>
<body>
  <div id="star-canvas" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="../index.html">별빛<span>연구소</span></a>
      <a class="btn btn-ghost" href="../index.html#info" style="min-height:2.25rem;font-size:0.75rem;">인포그래픽</a>
    </div>
  </header>
  <main class="shell tool-page">
    <p class="section-label">Knowledge Quizzes</p>
    <h1 style="font-family:var(--font-serif);font-size:1.5rem;margin-bottom:0.5rem;">인포그래픽 지식 퀴즈</h1>
    <p class="section-lead">인포그래픽과 짝을 이루는 4종 지식 탐구. 점술이 아닌 관측·학습용입니다.</p>
    <div class="knowledge-hub-grid" id="hub"></div>
  </main>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
  <script type="module" src="../js/bg.js"></script>
  <script type="module">
    import { loadJson } from '../js/site.js';

    const [{ quizzes }, { items }] = await Promise.all([
      loadJson('../data/knowledge-quizzes.json'),
      loadJson('../data/infographics.json'),
    ]);
    const byId = Object.fromEntries(items.map((i) => [i.id, i]));
    const hub = document.getElementById('hub');
    hub.innerHTML = quizzes.map((q) => {
      const info = byId[q.infographicId];
      return `
        <a class="knowledge-hub-card" href="${q.slug}.html" style="border-top:3px solid ${q.color}">
          <span class="knowledge-hub-card__badge">지식 퀴즈 · ${q.itemCount}문항</span>
          <h3>${q.title}</h3>
          <p>${info?.teaser || ''}</p>
        </a>`;
    }).join('');
  </script>
</body>
</html>
