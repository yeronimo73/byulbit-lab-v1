    <line x1="24" y1="20" x2="38" y2="28" stroke="#d4a8c8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="24" y1="20" x2="24" y2="32" stroke="#d4a8c8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="24" y1="32" x2="24" y2="40" stroke="#d4a8c8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="10" cy="28" r="1.5" fill="#f4f2fa" filter="url(#glow)"/>
    <circle cx="24" cy="20" r="1.8" fill="#f4f2fa" filter="url(#glow)"/>
    <circle cx="38" cy="28" r="1.5" fill="#f4f2fa" filter="url(#glow)"/>
